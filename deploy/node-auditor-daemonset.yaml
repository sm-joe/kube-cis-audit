apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecis-node-auditor
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubecis-node-auditor
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kubecis-node-auditor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubecis-node-auditor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubecis-node-auditor
    spec:
      serviceAccountName: kubecis-node-auditor
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: node-auditor
          image: ghcr.io/sm-joe/kubecis:milestone-2-step-2.2
          imagePullPolicy: IfNotPresent
          args:
            - node-audit
            - --benchmark
            - cis-2.1.0
            - --host-root
            - /host
            - --node-name
            - $(NODE_NAME)
            - --output
            - json
            - --interval
            - 24h
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
