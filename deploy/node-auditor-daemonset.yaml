apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecis-node-auditor
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubecis-node-auditor
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kubecis-node-auditor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubecis-node-auditor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubecis-node-auditor
    spec:
      serviceAccountName: kubecis-node-auditor
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: node-auditor
          image: ghcr.io/sm-joe/kubecis:milestone-2-step-2.2-metadata-helper
          imagePullPolicy: IfNotPresent
          args:
            - node-audit
            - --benchmark
            - cis-2.1.0
            - --metadata-file
            - /shared/node-metadata.json
            - --node-name
            - $(NODE_NAME)
            - --output
            - json
            - --interval
            - 24h
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: node-metadata
              mountPath: /shared
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: node-metadata
          image: ghcr.io/sm-joe/kubecis:milestone-2-step-2.2-metadata-helper
          imagePullPolicy: IfNotPresent
          args:
            - node-metadata
            - --benchmark
            - cis-2.1.0
            - --host-root
            - /host-kubelet
            - --output-file
            - /shared/node-metadata.json
            - --node-name
            - $(NODE_NAME)
            - --interval
            - 15s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          volumeMounts:
            - name: kubelet-directory
              mountPath: /host-kubelet
              readOnly: true
            - name: node-metadata
              mountPath: /shared
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: kubelet-directory
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: node-metadata
          emptyDir:
            sizeLimit: 1Mi
