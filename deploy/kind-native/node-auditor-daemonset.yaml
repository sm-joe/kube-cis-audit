apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecis-node-auditor
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubecis-node-auditor
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kubecis-node-auditor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubecis-node-auditor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubecis-node-auditor
    spec:
      serviceAccountName: kubecis-node-auditor
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: node-metadata-init
        image: localhost/kubecis-native:integrated-rc3.2
        imagePullPolicy: Never
        args:
        - node-metadata
        - --benchmark
        - cis-2.1.0
        - --host-root
        - /host-kubelet
        - --node-name
        - $(NODE_NAME)
        - --output-file
        - /metadata/snapshot.json
        - --interval
        - 0s
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
            add:
            - DAC_READ_SEARCH
        volumeMounts:
        - name: kubelet-config
          mountPath: /host-kubelet
          readOnly: true
        - name: metadata
          mountPath: /metadata
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
      containers:
      - name: node-auditor
        image: localhost/kubecis-native:integrated-rc3.2
        imagePullPolicy: Never
        args:
        - node-audit
        - --benchmark
        - cis-2.1.0
        - --metadata-file
        - /metadata/snapshot.json
        - --node-name
        - $(NODE_NAME)
        - --output
        - json
        - --interval
        - 24h
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: metadata
          mountPath: /metadata
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      - name: node-metadata-helper
        image: localhost/kubecis-native:integrated-rc3.2
        imagePullPolicy: Never
        args:
        - node-metadata
        - --benchmark
        - cis-2.1.0
        - --host-root
        - /host-kubelet
        - --node-name
        - $(NODE_NAME)
        - --output-file
        - /metadata/snapshot.json
        - --interval
        - 15s
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
            add:
            - DAC_READ_SEARCH
        volumeMounts:
        - name: kubelet-config
          mountPath: /host-kubelet
          readOnly: true
        - name: metadata
          mountPath: /metadata
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: kubelet-config
        hostPath:
          path: /var/lib/kubelet
          type: Directory
      - name: metadata
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
