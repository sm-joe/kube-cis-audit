apiVersion: batch/v1
kind: Job
metadata:
  name: kubecis-audit
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kubecis
    app.kubernetes.io/component: cluster-audit
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubecis
        app.kubernetes.io/component: cluster-audit
    spec:
      serviceAccountName: kubecis
      automountServiceAccountToken: true
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubecis
          image: ghcr.io/sm-joe/kubecis:2.9.0
          imagePullPolicy: IfNotPresent
          args:
            - scan
            - --benchmark
            - cis-2.1.0
            - --target
            - all
            - --output
            - json
          env:
            - name: KUBECIS_CONFIG_DIR
              value: /app/benchmarks
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
