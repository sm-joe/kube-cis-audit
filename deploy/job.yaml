apiVersion: batch/v1
kind: Job
metadata:
  name: kubecis-audit
  namespace: kube-system
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: kubecis
      restartPolicy: Never
      containers:
        - name: kubecis
          image: ghcr.io/sm-joe/kubecis:2.3.2-admission-inventory
          imagePullPolicy: Always
          args: ["scan", "--benchmark", "cis-2.1.0", "--target", "policies", "--output", "json"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
