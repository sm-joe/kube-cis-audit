id: cis-2.1.0
name: CIS Kubernetes Benchmark v2.1.0 - KubeCIS provisional starter profile
# Provisional Kubernetes 1.37 mapping: verify distribution applicability against the
# official CIS benchmark before treating these results as compliance evidence.
kubernetesMinor: ["37"]
compatibilityStatus: provisional
compatibilityNote: "Provisional Kubernetes 1.37 mapping. This is a limited starter profile, not the complete CIS benchmark."
checks:
  - id: 1.1.1
    title: API server pod specification file permissions are 0600 or more restrictive
    description: Checks Unix permission bits on the API server static pod manifest when the host filesystem is explicitly mounted and readable.
    target: master
    kind: host_file_mode
    path: etc/kubernetes/manifests/kube-apiserver.yaml
    maxMode: "0600"
    scored: true
    remediation: Restrict permissions on the API server manifest to 0600 or more restrictive.
  - id: 1.2.1
    title: API server anonymous authentication is disabled
    description: Requires inspection of the API server configuration or managed control-plane provider evidence; API-only scanning cannot verify the effective flag.
    target: master
    kind: manual
    scored: false
    manual: true
    remediation: Verify that the API server --anonymous-auth argument is set to false, accounting for provider-specific health-check requirements.
  - id: 4.1.9
    title: Kubelet config.yaml permissions are 0600 or more restrictive
    target: node
    kind: host_file_mode
    path: var/lib/kubelet/config.yaml
    maxMode: "0600"
    scored: true
    remediation: Restrict the kubelet config.yaml file permissions to 0600 or more restrictive, subject to the platform's supported configuration.
  - id: 5.1.1
    title: Ensure cluster-admin role is only used where required
    target: policies
    kind: api_cluster_admin
    scored: true
    remediation: Remove unnecessary cluster-admin bindings and use least-privilege roles.
  - id: 5.2.1
    title: Ensure the cluster has at least one active policy control mechanism
    description: Evaluates namespace-level Pod Security Admission enforce labels and detects limited alternative admission-policy candidates. Candidate detection is not proof of effective enforcement.
    target: policies
    kind: api_policy_control
    scored: true
    remediation: Enable Pod Security Admission with baseline/restricted enforcement labels or verify another active admission policy mechanism such as Kyverno or Gatekeeper.
  - id: 5.2.7
    title: Minimize the admission of root containers
    target: policies
    description: Evaluates effective Pod/container runAsNonRoot and runAsUser settings on non-terminal Pods. Missing image-user metadata is treated as unknown rather than proof of root execution.
    kind: api_pod_non_root
    scored: true
    remediation: "Set runAsNonRoot: true at pod or container level, and verify images run as a non-root UID."
  - id: 5.3.2
    title: Ensure all namespaces have NetworkPolicies defined
    target: policies
    description: Requires at least one NetworkPolicy object in every namespace, including system namespaces. Presence does not prove effective traffic isolation or CNI enforcement.
    kind: api_network_policy
    scored: true
    remediation: Define appropriate NetworkPolicies for each namespace; a policy's presence alone does not prove effective isolation.
  - id: 5.6.2
    title: Ensure the seccomp profile is set in pod definitions
    target: policies
    description: Evaluates effective Pod/container seccomp profile settings on non-terminal Pods; RuntimeDefault and Localhost are accepted explicit profiles.
    kind: api_pod_seccomp
    scored: true
    remediation: Set seccompProfile.type to RuntimeDefault at pod or container level where compatible.

  - id: KUBECIS-2.4.1
    title: Inventory effective runAsGroup and fsGroup security-context settings
    description: KubeCIS extension (not an official CIS control). Reports explicit primary GID and Pod fsGroup configuration without treating missing values or non-zero IDs as proof of security.
    target: policies
    kind: api_pod_group_security_context
    scored: false
    remediation: Review GID 0 warnings and validate group permissions and volume ownership against workload requirements.

  - id: KUBECIS-2.4.2
    title: Assess privileged containers and privilege escalation
    description: KubeCIS extension (not an official CIS control). Evaluates container-scoped privileged and allowPrivilegeEscalation settings, including Kubernetes defaults and CAP_SYS_ADMIN behavior.
    target: policies
    kind: api_pod_privilege_security
    scored: false
    remediation: Set privileged to false and allowPrivilegeEscalation to false; avoid adding CAP_SYS_ADMIN unless explicitly required and risk-accepted.

  - id: KUBECIS-2.4.3
    title: Assess Linux capability reduction and additions
    description: KubeCIS extension (not an official CIS control). Checks whether each workload container drops ALL Linux capabilities and records capabilities added back. Added capabilities require workload-specific justification; effective runtime capabilities are not inferred.
    target: policies
    kind: api_pod_capabilities
    scored: false
    remediation: Configure securityContext.capabilities.drop to include ALL. Add back only capabilities required by the workload and document their justification.

  - id: KUBECIS-2.4.4
    title: Assess read-only container root filesystems and writable volume mounts
    description: KubeCIS extension (not an official CIS control). Evaluates readOnlyRootFilesystem on regular, init, and ephemeral containers. Reports writable volume mounts separately because read-only root filesystems do not make mounted volumes read-only. VolumeDevices and effective runtime mount state are not assessed.
    target: policies
    kind: api_pod_read_only_rootfs
    scored: false
    remediation: "Set securityContext.readOnlyRootFilesystem to true. Review writable volume mounts individually and set readOnly: true where the workload does not require write access."

  - id: KUBECIS-2.4.5
    title: Assess host namespace sharing by Pods
    description: KubeCIS extension (not an official CIS control). Evaluates hostPID, hostIPC, and hostNetwork independently for non-terminal Pods. Explicitly enabled host namespace sharing is reported as a security finding. Unset fields use Kubernetes API defaults of false.
    target: policies
    kind: api_pod_host_namespaces
    scored: false
    remediation: Set hostPID, hostIPC, and hostNetwork to false unless host namespace sharing is explicitly required, documented, and approved.

  - id: KUBECIS-2.4.6
    title: Assess HostPath volume exposure
    description: KubeCIS extension (not an official CIS control). Inventories HostPath volumes and their container mounts/block-device mappings across non-terminal Pods. Sensitive host paths exposed writable fail; sensitive read-only mounts warn; other writable HostPath mounts warn. Mount propagation and unmounted HostPath declarations are reported separately. This evaluates Pod specifications, not resolved host filesystem objects or runtime mount state.
    target: policies
    kind: api_pod_hostpath
    scored: false
    remediation: Avoid HostPath volumes where possible. Prefer PersistentVolumes, projected volumes, or dedicated CSI drivers. If HostPath is unavoidable, restrict the path to the narrowest required location, mount it read-only, disable mount propagation, and document an owner-approved exception.

  - id: KUBECIS-2.4.7
    title: Consolidate workload security assessment results
    description: KubeCIS extension (not an official CIS control). Summarizes the individual KubeCIS workload security checks from 2.4.1 through 2.4.6 without re-scanning resources. FAIL takes precedence over WARN, and incomplete evidence prevents an overall PASS.
    target: policies
    kind: report_workload_security_summary
    scored: false
    remediation: Review all underlying workload security findings and resolve or formally accept each exception. A summary status does not replace review of individual evidence.
