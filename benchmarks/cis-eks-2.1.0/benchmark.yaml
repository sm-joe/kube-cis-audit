id: cis-eks-2.1.0
name: "KubeCIS Native — Amazon EKS benchmark v2.1.0 (assessment coverage under development)"
kubernetesMinor: ["34", "35", "36", "37"]
compatibilityStatus: provisional
compatibilityNote: "Official EKS 2.1.0 control identities; unmapped checks are NOT_ASSESSED and require implementation. This profile does not confer complete compliance."
checks:
  - id: "3.1.1"
    title: "Kubelet kubeconfig permissions"
    target: node
    kind: host_file_mode
    scored: true
    path: "var/lib/kubelet/kubeconfig"
    maxMode: "0644"
    description: "Native allowlisted Linux node file metadata; missing files or ownership evidence remain NOT_ASSESSED."
    remediation: "Review the active kubelet --kubeconfig path and enforce permissions of 0644 or stricter through node provisioning."
  - id: "3.1.2"
    title: "Kubelet kubeconfig ownership"
    target: node
    kind: host_file_owner
    scored: true
    path: "var/lib/kubelet/kubeconfig"
    description: "Native allowlisted Linux node file metadata; missing files or ownership evidence remain NOT_ASSESSED."
    remediation: "Review the active kubelet --kubeconfig path; ensure root:root ownership through node provisioning."
  - id: "3.1.3"
    title: "EKS kubelet configuration permissions"
    target: node
    kind: host_file_mode
    scored: true
    path: "etc/kubernetes/kubelet/config.json"
    maxMode: "0644"
    description: "Native control with reviewable evidence and unknown-state handling."
    remediation: "Review the official CIS EKS 2.1.0 recommendation and apply only verified, applicable remediation."
  - id: "3.1.4"
    title: "Kubelet configuration file ownership"
    target: node
    kind: host_file_owner
    scored: true
    path: "etc/kubernetes/kubelet/config.json"
    description: "Native allowlisted Linux node file metadata; missing files or ownership evidence remain NOT_ASSESSED."
    remediation: "Ensure the kubelet configuration file used by nodeadm is owned by UID 0 and GID 0 through supported node group provisioning."
  - id: "3.2.1"
    title: "EKS kubelet anonymous authentication"
    target: node
    kind: host_kubelet_config_field
    scored: true
    path: "var/lib/kubelet/config.yaml"
    field: "authentication.anonymous.enabled"
    description: "Native control with reviewable evidence and unknown-state handling."
    remediation: "Review the official CIS EKS 2.1.0 recommendation and apply only verified, applicable remediation."
  - id: "3.2.2"
    title: "EKS kubelet authorization mode"
    target: node
    kind: host_kubelet_config_field
    scored: true
    path: "var/lib/kubelet/config.yaml"
    field: "authorization.mode"
    description: "Native control with reviewable evidence and unknown-state handling."
    remediation: "Review the official CIS EKS 2.1.0 recommendation and apply only verified, applicable remediation."
  - id: "3.2.3"
    title: "Kubelet X.509 client CA configured"
    target: node
    kind: host_kubelet_config_field
    scored: true
    path: "var/lib/kubelet/config.yaml"
    field: "authentication.x509.clientCAFile"
    description: "Native node-local assessment from a bounded AL2023/kubeadm kubelet metadata snapshot; unknown values fail closed."
    remediation: "Configure the kubelet X.509 client CA path using the documented node bootstrap mechanism; verify trusted client certificates."
  - id: "3.2.4"
    title: "Disable kubelet read-only port"
    target: node
    kind: host_kubelet_config_field
    scored: true
    path: "var/lib/kubelet/config.yaml"
    field: "readOnlyPort"
    description: "Native node-local assessment from a bounded AL2023/kubeadm kubelet metadata snapshot; unknown values fail closed."
    remediation: "Set the kubelet readOnlyPort explicitly to 0 in node configuration."
  - id: "3.2.5"
    title: "Enable kubelet iptables utility chains"
    target: node
    kind: host_kubelet_config_field
    scored: true
    path: "var/lib/kubelet/config.yaml"
    field: "makeIPTablesUtilChains"
    description: "Native node-local assessment from a bounded AL2023/kubeadm kubelet metadata snapshot; unknown values fail closed."
    remediation: "Enable makeIPTablesUtilChains in the kubelet configuration after confirming cluster networking requirements."
  - id: "3.2.6"
    title: "Review kubelet event recording QPS"
    target: node
    kind: host_kubelet_config_field
    scored: true
    path: "var/lib/kubelet/config.yaml"
    field: "eventRecordQPS"
    description: "Native node-local assessment from a bounded AL2023/kubeadm kubelet metadata snapshot; unknown values fail closed."
    remediation: "Review the live effective kubelet eventRecordQPS (default 50); select a justified bounded event rate based on workload volume. A value of 0 disables rate limiting and is not an automatic PASS."
  - id: "3.2.7"
    title: "Kubelet client certificate rotation"
    target: node
    kind: host_kubelet_config_field
    scored: true
    path: "var/lib/kubelet/config.yaml"
    field: "rotateCertificates"
    description: "Native node-local assessment from a bounded AL2023/kubeadm kubelet metadata snapshot; unknown values fail closed."
    remediation: "Enable kubelet client certificate rotation when kubelet client certificates are used; verify the effective bootstrap configuration."
  - id: "3.2.8"
    title: "Kubelet server certificate TLS bootstrap and rotation"
    target: node
    kind: host_kubelet_config_field
    scored: true
    path: "var/lib/kubelet/config.yaml"
    field: "serverTLSBootstrap"
    description: "Native node-local assessment from a bounded AL2023/kubeadm kubelet metadata snapshot; unknown values fail closed."
    remediation: "Enable serverTLSBootstrap and RotateKubeletServerCertificate together; verify certificate approval and rotation."
  - id: "4.1.1"
