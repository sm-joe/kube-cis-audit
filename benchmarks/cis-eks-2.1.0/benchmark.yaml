    kind: manual
    scored: false
    manual: true
    description: "Human evidence review: Restrict cluster-admin role to approved administrators. Decisions must be tied to a hashed scan and include reviewer, justification and evidence reference."
    remediation: "List cluster-admin bindings and approve only the required service accounts and principals; remove excessive cluster-admin privileges."
