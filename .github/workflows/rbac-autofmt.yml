name: Format RBAC PR Sources
on:
  push:
    branches:
      - feat/eks-bound-rbac-evidence-20261119
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format and commit RBAC source
        run: |
          gofmt -w internal/audit/eks_bound_rbac.go internal/audit/eks_bound_rbac_test.go internal/audit/eks_manual_evidence.go internal/audit/eks_210_manual_rbac_conformance_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/audit/eks_bound_rbac.go internal/audit/eks_bound_rbac_test.go internal/audit/eks_manual_evidence.go internal/audit/eks_210_manual_rbac_conformance_test.go
            git commit -m "style: gofmt EKS RBAC implementation"
            git push origin HEAD:feat/eks-bound-rbac-evidence-20261119
          fi
