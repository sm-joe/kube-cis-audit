name: Format native CIS EKS policy files (temporary)
on:
  push:
    branches: [feature/cis210-official-native-implementation]
permissions:
  contents: write
concurrency:
  group: cis-native-eks-policy-format
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: gofmt and push
        run: |
          gofmt -w internal/audit/eks_policy_native.go internal/audit/eks_policy_native_test.go internal/audit/runner.go
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add internal/audit/eks_policy_native.go internal/audit/eks_policy_native_test.go internal/audit/runner.go
            git commit -m "style: format official CIS EKS native policy evaluators"
            git push origin HEAD:feature/cis210-official-native-implementation
          fi
