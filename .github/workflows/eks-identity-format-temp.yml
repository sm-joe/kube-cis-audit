name: Temporary EKS identity source formatting
on:
  push:
    branches: [feature/eks-release-e2e-gates]
permissions:
  contents: write
concurrency:
  group: eks-identity-format
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Go format
        run: |
          gofmt -w internal/audit/provider_evidence.go internal/audit/provider_evidence_test.go
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add internal/audit/provider_evidence.go internal/audit/provider_evidence_test.go
            git commit -m "style: format EKS identity verification"
            git push origin HEAD:feature/eks-release-e2e-gates
          fi
