name: Format EKS inventory Go tests (temporary)
on:
  push:
    branches: [feature/cis-eks-upstream-reference-inventory]
permissions:
  contents: write
concurrency:
  group: upstream-eks-inventory-format
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Format inventory code
        run: |
          gofmt -w cmd/benchmark-inventory/main.go cmd/benchmark-inventory/main_test.go
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add cmd/benchmark-inventory/
            git commit -m "style: format EKS benchmark reference inventory tests"
            git push origin HEAD:feature/cis-eks-upstream-reference-inventory
          fi
