name: Temporary EC2 Evidence Formatting
on:
  push:
    branches:
      - fix/eks-543-deduplicate-public-interface-evidence-20261119
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format and commit EC2 evidence changes
        run: |
          gofmt -w internal/audit/eks_private_node_network.go internal/audit/eks_private_node_network_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/audit/eks_private_node_network.go internal/audit/eks_private_node_network_test.go
            git commit -m "style: gofmt EC2 interface regression tests"
            git push origin HEAD:fix/eks-543-deduplicate-public-interface-evidence-20261119
          fi
