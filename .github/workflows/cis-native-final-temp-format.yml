name: Temporary final CIS EKS native gofmt
on:
  push:
    branches: [feature/cis210-official-native-implementation]
permissions:
  contents: write
concurrency:
  group: eks-native-final-gofmt
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.3'}
      - run: |
          gofmt -w internal/audit/eks_policy_native.go internal/audit/eks_policy_native_test.go
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add internal/audit/eks_policy_native.go internal/audit/eks_policy_native_test.go
            git commit -m "style: format EKS platform exception classification"
            git push origin HEAD:feature/cis210-official-native-implementation
          fi
