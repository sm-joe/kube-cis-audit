name: Temporary EKS RC2 Gofmt
on:
  push:
    branches: [fix/eks-native-provider-audit]
permissions:
  contents: write
concurrency:
  group: eks-rc2-gofmt
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Go format
        shell: bash
        run: |
          gofmt -w internal/audit/metadata.go internal/audit/eks_nodeadm_test.go cmd/kubecis/main.go
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add internal/audit/metadata.go internal/audit/eks_nodeadm_test.go cmd/kubecis/main.go
            git commit -m "style: gofmt AL2023 nodeadm RC2 changes"
            git push origin HEAD:fix/eks-native-provider-audit
          fi
