name: EKS Candidate Image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubecis-main-candidate
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate scanner and operator workflow
        run: |
          test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          go vet ./...
          go test ./... -count=1
          bash scripts/test-deploy-eks.sh
          bash scripts/test-linux-eks.sh
          bash scripts/test-node-auditor-readiness.sh
          bash scripts/test-eks-provider.sh
          bash scripts/test-eks-access-cni.sh
          bash scripts/test-eks-ecr.sh
          bash scripts/test-eks-scan-attestation.sh
          bash scripts/test-eks-aws-review.sh
          bash scripts/test-eks-node-network.sh
          bash scripts/test-linux-install.sh
          python3 scripts/verify-eks-evaluator-conformance.py
          python3 scripts/test-eks-evaluator-conformance.py
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/sm-joe/kubecis
      VERSION: candidate-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
      - name: Build and push candidate image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Verify platforms and actual executable
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          ref="$IMAGE@$DIGEST"
          docker buildx imagetools inspect --raw "$ref" > /tmp/index.json
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" 'any(.manifests[]; .platform.os=="linux" and .platform.architecture==$arch)' /tmp/index.json
            docker run --rm --platform "linux/$arch" "$ref" version | grep -Fx "$VERSION"
          done
      - name: Sign and verify candidate image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/eks-candidate-image.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - name: Package matching Linux CLI and deployment assets
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p dist /tmp/candidate
          for arch in amd64 arm64; do
            stage="/tmp/candidate/$arch"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/sm-joe/kube-cis-audit/internal/audit.BuildVersion=$VERSION" -o "$stage/kubecis" ./cmd/kubecis
            cp -R benchmarks scripts deploy docs "$stage/"
            cp README.md LICENSE ATTRIBUTION.md "$stage/"
            printf '%s\n' "$IMAGE@$DIGEST" > "$stage/IMAGE_DIGEST"
            printf '%s\n' "$GITHUB_SHA" > "$stage/SOURCE_COMMIT"
            if [[ "$arch" == amd64 ]]; then
              "$stage/kubecis" version | grep -Fx "$VERSION"
              bash "$stage/scripts/test-deploy-eks.sh"
            fi
            tar -C "$stage" -czf "dist/kubecis_candidate_linux_$arch.tar.gz" .
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          for asset in dist/*.tar.gz dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            cosign verify-blob --bundle "$asset.sigstore.json" --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/eks-candidate-image.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$asset"
          done
          printf 'Candidate: %s\nImage: %s@%s\n' "$VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: kubecis-signed-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
