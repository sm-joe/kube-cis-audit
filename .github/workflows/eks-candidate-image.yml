name: EKS Candidate Image
on:
  push:
    branches:
      - fix/eks-native-provider-audit
concurrency:
  group: kubecis-eks-candidate
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  publish-eks-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify native auditor
        run: |
          test -z "$(gofmt -l internal/audit/*.go)"
          go vet ./...
          go test ./... -count=1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=3.1.0-native-eks-rc1
          tags: |
            ghcr.io/sm-joe/kubecis:eks-provider-rc
            ghcr.io/sm-joe/kubecis:eks-provider-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=3.1.0-native-eks-rc1
