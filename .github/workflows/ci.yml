name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          test -z "$(gofmt -l $(find cmd internal -name '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build Linux CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/kubecis ./cmd/kubecis
