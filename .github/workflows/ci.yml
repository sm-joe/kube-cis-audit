name: CI Pipeline

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true

      - name: Verify Formatting
        shell: bash
        run: |
          files=$(find . -type f -name '*.go' -not -path './vendor/*')
          gofmt -l $files
          gofmt -d cmd/kubecis/enrich_node.go internal/audit/provider_evidence.go internal/audit/eks_manual_evidence.go
          gofmt -d internal/audit/eks_kubelet_extended.go internal/audit/eks_kubelet_extended_test.go
          test -z "$(gofmt -l $files)"

      - name: Validate Linux EKS deployment helper
        shell: bash
        run: bash scripts/test-deploy-eks.sh

      - name: Validate Linux EKS collection and provisional release gates
        shell: bash
        run: |
          bash scripts/test-linux-eks.sh
          bash scripts/test-deploy-eks.sh

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test ./... -count=1
        
      - name: Build Linux CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/kubecis ./cmd/kubecis
