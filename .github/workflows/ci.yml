name: CI Pipeline

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true

      - name: Verify Formatting
        shell: bash
        run: |
          files=$(find . -type f -name '*.go' -not -path './vendor/*')
          gofmt -l $files
          test -z "$(gofmt -l $files)"

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test ./... -count=1
        
      - name: Build Linux CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/kubecis ./cmd/kubecis
