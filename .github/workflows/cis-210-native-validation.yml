name: CIS v2.1.0 native assessment validation
on:
  push:
    branches: [feature/cis-210-source-validated-core, feature/cis210-official-native-implementation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Format, vet and test native benchmark implementation
        run: |
          test -z "$(gofmt -l internal/audit/*.go cmd/kubecis/main.go)"
          go vet ./...
          go test ./... -count=1
          CGO_ENABLED=0 go build -trimpath -o /tmp/kubecis ./cmd/kubecis
