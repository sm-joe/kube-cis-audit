name: Format native assessment dossier source
on:
  push:
    branches:
      - feature/cis210-official-native-implementation
    paths:
      - .github/workflows/format-native-review.yml
      - cmd/kubecis/finalize.go
      - cmd/kubecis/finalize_test.go
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cis210-official-native-implementation
          persist-credentials: true
      - name: Format and commit only finalized dossier sources
        run: |
          gofmt -w cmd/kubecis/finalize.go cmd/kubecis/finalize_test.go
          if ! git diff --quiet -- cmd/kubecis/finalize.go cmd/kubecis/finalize_test.go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cmd/kubecis/finalize.go cmd/kubecis/finalize_test.go
            git commit -m 'style: gofmt final assessment implementation and tests'
            git push origin HEAD:feature/cis210-official-native-implementation
          fi
