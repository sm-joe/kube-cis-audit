name: Temporary CIS catalog Go formatting
on:
  push:
    branches: [feature/cis-210-source-validated-core]
permissions:
  contents: write
concurrency:
  group: cis-210-catalog-format
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Go format source-validated CIS catalog
        run: |
          gofmt -w internal/audit/cis_catalog.go internal/audit/cis_catalog_test.go
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add internal/audit/cis_catalog.go internal/audit/cis_catalog_test.go
            git commit -m "style: gofmt official CIS v2.1.0 catalog and coverage tests"
            git push origin HEAD:feature/cis-210-source-validated-core
          fi
