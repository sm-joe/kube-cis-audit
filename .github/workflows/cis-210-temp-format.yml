name: Temporary CIS native source formatting
on:
  push:
    branches: [feature/cis-210-source-validated-core]
permissions:
  contents: write
concurrency:
  group: cis-210-native-format
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Format native assessment files
        run: |
          gofmt -w internal/audit/eks_cis_evidence.go internal/audit/eks_cis_evidence_test.go internal/audit/eks_cis_attach.go internal/audit/eks_cis_attach_test.go internal/audit/provider_profile.go internal/audit/provider_profile_test.go internal/audit/runner.go cmd/kubecis/main.go
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add internal/audit cmd/kubecis/main.go
            git commit -m "style: format source-validated CIS EKS 2.1.0 native checks"
            git push origin HEAD:feature/cis-210-source-validated-core
          fi
