name: Release Pipeline

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build and Package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          STAGE="$RUNNER_TEMP/kubecis"
          mkdir -p "$STAGE/benchmarks" dist
          cp -R benchmarks/. "$STAGE/benchmarks/"
          cp README.md "$STAGE/README.md"
          cp -R docs "$STAGE/docs"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/sm-joe/kube-cis-audit/internal/audit.BuildVersion=$VERSION" \
            -o "$STAGE/kubecis$EXT" ./cmd/kubecis
          NAME="kubecis_${GOOS}_${GOARCH}"
          if [ "$ARCHIVE" = "zip" ]; then
            (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/dist/${NAME}.zip" .)
          else
            tar -C "$STAGE" -czf "$GITHUB_WORKSPACE/dist/${NAME}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: kubecis-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: cd dist && sha256sum kubecis_* > SHA256SUMS

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  container:
    name: Publish Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-architecture Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubecis:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kubecis:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
