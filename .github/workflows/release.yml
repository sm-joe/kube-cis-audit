name: Release Pipeline

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "benchmarks/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Release Tag
        if: github.ref_type == 'tag' && github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Prevent stable release while official CIS EKS mapping is provisional
        if: github.ref_type == 'tag' && github.event_name == 'push'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] &&
             grep -q '^compatibilityStatus: provisional$' benchmarks/cis-eks-2.1.0/benchmark.yaml; then
            echo "::error::Stable release blocked: EKS benchmark mapping remains provisional"
            exit 1
          fi

      - name: Enforce independently verified CIS evaluator conformance for stable tags
        if: github.ref_type == 'tag' && github.event_name == 'push' && !contains(github.ref_name, '-')
        shell: bash
        env:
          APPROVAL_KEY: ${{ vars.CIS_EKS_APPROVAL_PUBLIC_KEY }}
          APPROVAL_PIN: ${{ vars.CIS_EKS_APPROVAL_KEY_SHA256 }}
          APPROVAL_SIGNATURE: ${{ vars.CIS_EKS_APPROVAL_SIGNATURE_BASE64 }}
        run: |
          test -n "$APPROVAL_KEY" && test -n "$APPROVAL_PIN" && test -n "$APPROVAL_SIGNATURE"
          printf '%s\n' "$APPROVAL_KEY" > "$RUNNER_TEMP/cis-review.pem"
          printf '%s' "$APPROVAL_SIGNATURE" | base64 --decode > "$RUNNER_TEMP/cis-review.sig"
          python3 scripts/verify-eks-evaluator-conformance.py --require-full \
            --approval-public-key "$RUNNER_TEMP/cis-review.pem" \
            --approval-key-sha256 "$APPROVAL_PIN" \
            --approval-signature "$RUNNER_TEMP/cis-review.sig"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true

      - name: Verify Formatting
        shell: bash
        run: |
          files=$(find . -type f -name '*.go' -not -path './vendor/*')
          test -z "$(gofmt -l $files)"

      - name: Validate Linux acceptance helpers
        shell: bash
        run: |
          bash scripts/test-linux-eks.sh
          bash scripts/test-eks-provider.sh
          bash scripts/test-eks-access-cni.sh
          bash scripts/test-eks-ecr.sh
          bash scripts/test-eks-scan-attestation.sh
          bash scripts/test-eks-aws-review.sh
          bash scripts/test-eks-node-network.sh
          python3 scripts/verify-eks-evaluator-conformance.py
          python3 scripts/test-eks-evaluator-conformance.py
          bash scripts/test-linux-install.sh

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Complete Go Test Suite
        run: go test ./... -count=1

      - name: Build Release CLI
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /tmp/kubecis ./cmd/kubecis

  binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true

      - name: Build and Package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_type == 'tag' && github.event_name == 'push' && github.ref_name || 'v0.0.0-validation' }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          STAGE="$RUNNER_TEMP/kubecis"
          mkdir -p "$STAGE/benchmarks" dist
          cp -R benchmarks/. "$STAGE/benchmarks/"
          mkdir -p "$STAGE/internal/audit/catalogs"
          cp internal/audit/catalogs/eks-2.1.0.json "$STAGE/internal/audit/catalogs/"
          cp README.md LICENSE ATTRIBUTION.md "$STAGE/"
          cp -R docs "$STAGE/docs"
          mkdir -p "$STAGE/scripts" "$STAGE/deploy"
          cp scripts/*.sh "$STAGE/scripts/"
          cp -R deploy/eks "$STAGE/deploy/eks"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/sm-joe/kube-cis-audit/internal/audit.BuildVersion=$VERSION" \
            -o "$STAGE/kubecis$EXT" ./cmd/kubecis
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            "$STAGE/kubecis" version | grep -Fx "$VERSION"
            bash "$STAGE/scripts/test-linux-eks.sh" --packaged
            bash "$STAGE/scripts/test-deploy-eks.sh"
          fi
          NAME="kubecis_${GOOS}_${GOARCH}"
          if [ "$ARCHIVE" = "zip" ]; then
            (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/dist/${NAME}.zip" .)
          else
            tar -C "$STAGE" -czf "$GITHUB_WORKSPACE/dist/${NAME}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: kubecis-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  verify_archives:
    name: Verify packaged release archives
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify archive contents and checksums
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.event_name == 'push' && github.ref_name || 'v0.0.0-validation' }}
        run: |
          cd dist
          sha256sum kubecis_* > SHA256SUMS
          sha256sum -c SHA256SUMS
          for archive in kubecis_linux_amd64.tar.gz kubecis_linux_arm64.tar.gz kubecis_darwin_amd64.tar.gz kubecis_darwin_arm64.tar.gz; do
            test -s "$archive"
            tar -tzf "$archive" > "$RUNNER_TEMP/archive-list"
            grep -Fx ./kubecis "$RUNNER_TEMP/archive-list"
            grep -Fx ./benchmarks/cis-eks-2.1.0/benchmark.yaml "$RUNNER_TEMP/archive-list"
            grep -Fx ./internal/audit/catalogs/eks-2.1.0.json "$RUNNER_TEMP/archive-list"
          done
          unzip -t kubecis_windows_amd64.zip
          stage="$(mktemp -d)"
          tar -xzf kubecis_linux_amd64.tar.gz -C "$stage"
          "$stage/kubecis" version | grep -Fx "$VERSION"
          "$stage/kubecis" --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && github.event_name == 'push'
    needs: [verify_archives, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: kubecis-*
          merge-multiple: true

      - name: Generate Checksums and immutable release manifest
        env:
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        shell: bash
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          cd dist
          sha256sum kubecis_* > SHA256SUMS
          jq -n --arg version "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kubecis@$IMAGE_DIGEST" \
            '{schemaVersion:1,version:$version,commit:$commit,image:$image}' > release-manifest.json

      - name: Attest release archives and checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'

      - name: Install Cosign for keyless binary signing
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign and verify release assets
        shell: bash
        run: |
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          for file in dist/kubecis_* dist/SHA256SUMS dist/release-manifest.json; do
            test -s "$file"
            cosign sign-blob "$file" --bundle "$file.sigstore.json" --yes
            cosign verify-blob "$file" --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          done

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  container:
    name: Publish Container Image
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    if: github.ref_type == 'tag' && github.event_name == 'push'
    needs: verify_archives
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign for keyless OCI signing
        uses: sigstore/cosign-installer@v4.1.0

      - name: Set image tags
        id: image-tags
        shell: bash
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY_OWNER}/kubecis:${GITHUB_REF_NAME}"
          # Publish the versioned tag first; stable latest moves only after signature verification.
          { echo 'tags<<EOF'; printf '%s\n' "$tags"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Build and Push Multi-architecture Image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Sign published image by immutable digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          test -n "$DIGEST"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kubecis@$DIGEST"
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' >/dev/null

      - name: Promote verified stable digest to latest
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kubecis"
          docker buildx imagetools create --tag "$image:latest" "$image@$DIGEST"
          cosign verify "$image:latest" --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' >/dev/null
