apiVersion: v1
kind: Namespace
metadata:
  name: kubecis-e2e-insecure
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: overprivileged-workload
  namespace: kubecis-e2e-insecure
---
apiVersion: v1
kind: Pod
metadata:
  name: insecure-workload
  namespace: kubecis-e2e-insecure
  labels:
    app: insecure-workload
spec:
  hostNetwork: true
  hostPID: true
  serviceAccountName: overprivileged-workload
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
        capabilities:
          add: ["SYS_ADMIN"]
      volumeMounts:
        - name: host-etc
          mountPath: /host-etc
  volumes:
    - name: host-etc
      hostPath:
        path: /etc
        type: Directory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubecis-e2e-wildcard
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubecis-e2e-wildcard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubecis-e2e-wildcard
subjects:
  - kind: ServiceAccount
    name: overprivileged-workload
    namespace: kubecis-e2e-insecure
---
apiVersion: v1
kind: Service
metadata:
  name: insecure-nodeport
  namespace: kubecis-e2e-insecure
spec:
  type: NodePort
  selector:
    app: insecure-workload
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: kubecis-e2e-insecure
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
